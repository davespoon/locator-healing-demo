name: Locator healing PR

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: locator-healing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui-tests-with-healing:
    runs-on: ubuntu-latest
    environment: dev
    if: github.actor != 'github-actions[bot]'
    env:
      LOCATOR_HEALING_VERSION: 0.1.0
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Restore
        run: |
          dotnet restore src/Demo.UiTests/Demo.UiTests.csproj
          dotnet restore src/LocatorHealing.Agent/LocatorHealing.Agent.csproj

      - name: Prepare artifact directories
        run: mkdir -p artifacts/test-results artifacts/locator-healing artifacts/tool-feed artifacts/tools

      - name: Build UI tests
        run: dotnet build src/Demo.UiTests/Demo.UiTests.csproj --configuration Release --no-restore

      - name: Pack locator healing tool
        run: dotnet pack src/LocatorHealing.Agent/LocatorHealing.Agent.csproj --configuration Release --no-restore --output "${{ github.workspace }}/artifacts/tool-feed"

      - name: Run UI tests
        id: ui_tests
        continue-on-error: true
        working-directory: ${{ github.workspace }}/artifacts/test-results
        run: dotnet test "${{ github.workspace }}/src/Demo.UiTests/Demo.UiTests.csproj" --configuration Release --no-build --settings "${{ github.workspace }}/.runsettings" --logger "nunit;LogFilePath=${{ github.workspace }}/artifacts/test-results/nunit-results.xml"

      - name: Run locator healer
        id: healer
        if: steps.ui_tests.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is required to generate locator candidates."
            exit 1
          fi

          dotnet tool install --tool-path "${{ github.workspace }}/artifacts/tools" LocatorHealing.Agent --add-source "${{ github.workspace }}/artifacts/tool-feed" --version "$LOCATOR_HEALING_VERSION"

          set +e
          "${{ github.workspace }}/artifacts/tools/locator-healing" run "${{ github.workspace }}/artifacts/test-results/nunit-results.xml" --repo-root "${{ github.workspace }}" --output-dir "${{ github.workspace }}/artifacts/locator-healing" --report-file "${{ github.workspace }}/artifacts/locator-healing/locator-healing-report.md"
          HEALER_EXIT_CODE=$?
          set -e

          echo "exit_code=$HEALER_EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$HEALER_EXIT_CODE" -eq 1 ]; then
            echo "Locator healer failed with a tool error."
            exit 1
          fi

      - name: Check for locator changes
        id: diff
        if: steps.ui_tests.outcome == 'failure'
        run: |
          if git diff --quiet -- src; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure locator healing report exists
        if: steps.ui_tests.outcome == 'failure' && steps.diff.outputs.changed == 'true'
        run: |
          REPORT_FILE="${{ github.workspace }}/artifacts/locator-healing/locator-healing-report.md"

          if [ ! -f "$REPORT_FILE" ]; then
            printf '# Locator healing report\n\nAutomated locator-healing proposal. Please review before merging.\n' > "$REPORT_FILE"
          fi

      - name: Create locator healing PR
        id: create_pr
        if: steps.ui_tests.outcome == 'failure' && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            src
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          branch: locator-healing/${{ github.run_id }}-${{ github.run_attempt }}
          commit-message: Heal broken Selenium locator
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          delete-branch: true
          title: Heal broken Selenium locator
          body-path: artifacts/locator-healing/locator-healing-report.md

      - name: Report created pull request
        if: steps.create_pr.outputs.pull-request-url != ''
        run: |
          echo "Created review PR: ${{ steps.create_pr.outputs.pull-request-url }}"

      - name: Fail when locator healing could not create a patch
        if: steps.ui_tests.outcome == 'failure' && steps.diff.outputs.changed != 'true'
        run: |
          echo "UI tests failed, but locator healing did not produce a source change."
          exit 1

      - name: Upload locator healing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locator-healing-artifacts
          path: artifacts
          if-no-files-found: ignore